<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Keuangan Pribadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Laporan Keuangan</h1>

        <div class="mt-8">
            <h2 class="text-xl font-bold mb-4">Laporan Transaksi</h2>
            <div id="data-container" class="space-y-2">
                </div>
        </div>
    </div>

<script>
    // Pastikan URL dan KEY Anda benar
    const SUPABASE_URL = 'https://opgeeqnucxrdqcgwcuge.supabase.co';
    const SUPABASE_KEY = 'MASUKKAN_KUNCI_ANON_BARU_DI_SINI';

    // Inisialisasi hanya sekali
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function updateDashboard() {
        // Coba ambil data
        const { data, error } = await supabase
            .from('finance_transactions')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("Gagal ambil data:", error);
            return;
        }

        if (data) {
            const container = document.getElementById('data-container');
            container.innerHTML = data.map(item => `
                <div class="bg-white p-3 rounded shadow flex justify-between">
                    <span>${item.description}</span>
                    <span class="font-bold ${item.type === 'masuk' ? 'text-green-500' : 'text-red-500'}">
                        ${item.type === 'masuk' ? '+' : '-'} Rp ${item.amount}
                    </span>
                </div>
            `).join('');
        }
    }

    updateDashboard();
</script>
</body>
</html>
